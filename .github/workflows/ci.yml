name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ruff:
    name: Backend · ruff lint and format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          working-directory: backend

      # Ruff comes from uv.lock, so CI runs exactly the version used locally.
      - name: Install dev dependencies
        run: uv sync --locked --only-dev

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check --diff .

  backend-mypy:
    name: Backend · mypy (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          working-directory: backend

      # mypy needs the runtime dependencies to resolve their types.
      - name: Install dependencies
        run: uv sync --locked

      - name: mypy
        run: uv run --no-sync mypy

  backend-import-linter:
    name: Backend · import-linter (layer contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          working-directory: backend

      - name: Install dependencies
        run: uv sync --locked

      - name: lint-imports
        run: uv run --no-sync lint-imports --no-cache

  backend-unit-tests:
    name: Backend · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          working-directory: backend

      - name: Install dependencies
        run: uv sync --locked

      # Only tests that need neither Postgres nor Odoo. Tests marked "integration"
      # (Postgres) and "odoo" (Odoo container) are not run in CI for now.
      - name: pytest
        run: uv run --no-sync pytest -m "not integration and not odoo" -ra

  backend-generated-types:
    name: Backend · generated types up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          working-directory: backend

      - name: Install dependencies
        run: uv sync --locked

      - name: Regenerate from shared/schemas
        run: ./scripts/gen_types.sh

      # Fails if the checked-in generated code does not match the schema.
      - name: No diff
        run: |
          changes="$(git status --porcelain -- src/flow_tracer_api/generated)"
          if [ -n "$changes" ]; then
            echo "Generated types are out of date. Run backend/scripts/gen_types.sh and commit:"
            echo "$changes"
            git diff -- src/flow_tracer_api/generated
            exit 1
          fi
