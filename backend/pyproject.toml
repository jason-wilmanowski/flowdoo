[project]
name = "flow-tracer-api"
version = "0.1.0"
description = "API service of Odoo Flow Tracer: stores traces and talks to the user's Odoo."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_tracer_api"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "import-linter>=2.15",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]

[tool.ruff.lint.per-file-ignores]
# Generated from shared/schemas; long docstrings come from schema descriptions.
"src/flow_tracer_api/generated/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["flow_tracer_api", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the Postgres from docker compose (service db)",
    "odoo: needs the Odoo 19 test container (compose profile test), see tests/integration/odoo",
]

[tool.importlinter]
root_package = "flow_tracer_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers only depend downwards"
type = "layers"
containers = ["flow_tracer_api"]
# "a | b": independent layers on the same level, they must not import each other.
layers = ["api", "services", "repositories | integrations", "models"]

[[tool.importlinter.contracts]]
name = "core, domain, schemas and generated do not depend on application layers"
type = "forbidden"
source_modules = [
    "flow_tracer_api.core",
    "flow_tracer_api.domain",
    "flow_tracer_api.schemas",
    "flow_tracer_api.generated",
]
forbidden_modules = [
    "flow_tracer_api.api",
    "flow_tracer_api.services",
    "flow_tracer_api.repositories",
    "flow_tracer_api.models",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "domain is self-contained"
type = "forbidden"
source_modules = ["flow_tracer_api.domain"]
forbidden_modules = ["flow_tracer_api.core"]
